[project]
name = "log-sentinel"
version = "1.1.0"
description = "A beginner-friendly SSH brute-force & suspicious-login detector for Linux auth logs"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "bhatiasachin964-dot", email = "bhatiasachin964-dot@users.noreply.github.com" }]
keywords = ["security", "ssh", "brute-force", "auth-log", "detector", "mitre"]
classifiers = [
    "Intended Audience :: System Administrators",
    "Topic :: Security",
    "Topic :: System :: Networking :: Monitoring",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
]
# No runtime dependencies: pure standard library by design.

[project.scripts]
"log-sentinel" = "log_sentinel:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["log_sentinel"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["F", "E9"]